<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            min-height: 100vh;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        h1 { font-size: 22px; margin-bottom: 12px; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar {
            width: 56px; height: 56px; border-radius: 50%;
            background: var(--tg-theme-button-color, #2481cc);
            color: #fff; display: flex; align-items: center;
            justify-content: center; font-size: 24px; font-weight: bold;
        }
        .name { font-size: 18px; font-weight: 600; }
        .username { font-size: 14px; opacity: 0.7; }
        button {
            width: 100%; padding: 14px;
            border: none; border-radius: 10px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            font-size: 16px; font-weight: 600;
            cursor: pointer; margin-top: 8px;
        }
        button:active { opacity: 0.8; }
        button.secondary {
            background: transparent;
            color: var(--tg-theme-button-color, #2481cc);
            border: 1px solid var(--tg-theme-button-color, #2481cc);
        }
        .status-row {
            display: flex; justify-content: space-between;
            padding: 8px 0; font-size: 15px;
        }
        .label { opacity: 0.7; }
        .value { font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <div class="user-info">
            <div class="avatar" id="avatar">?</div>
            <div>
                <div class="name" id="user-name">Загрузка...</div>
                <div class="username" id="user-username">@...</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h1>📊 Мой статус</h1>
        <div class="status-row">
            <span class="label">Подписка</span>
            <span class="value" id="status">не активна</span>
        </div>
        <div class="status-row">
            <span class="label">Трафик</span>
            <span class="value">0 МБ</span>
        </div>
        <div class="status-row">
            <span class="label">Срок</span>
            <span class="value">—</span>
        </div>
    </div>

    <div class="card">
        <h1>🔐 Действия</h1>
        <button onclick="requestKey()">Получить VPN-ключ</button>
        <button class="secondary" onclick="closeApp()">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // растянуть на весь экран

        // Показываем данные пользователя
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').textContent =
                (user.first_name || '') + ' ' + (user.last_name || '');
            document.getElementById('user-username').textContent =
                user.username ? '@' + user.username : 'без username';
            document.getElementById('avatar').textContent =
                (user.first_name || '?').charAt(0).toUpperCase();
        } else {
            document.getElementById('user-name').textContent = 'Гость';
            document.getElementById('user-username').textContent = 'откройте через Telegram';
        }

        function requestKey() {
            tg.HapticFeedback.impactOccurred('medium');
            tg.sendData(JSON.stringify({ action: 'create_key', ts: Date.now() }));
            tg.close();
        }

        function closeApp() {
            tg.close();
        }
    </script>
</body>
</html>
